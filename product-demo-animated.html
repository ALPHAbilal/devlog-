<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devlog Product Demo - Animated</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM from CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>

    <!-- Lucide React (for icons) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-primary': '#0a1628',
                        'dark-secondary': '#1e3a5f',
                        'accent-green': '#10b981',
                        'text-primary': '#e0e7ff',
                        'text-secondary': '#94a3b8',
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --step-0: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
            --step-1: clamp(1.125rem, 1.05rem + 0.375vw, 1.5rem);
            --step-2: clamp(1.333rem, 1.2rem + 0.666vw, 1.875rem);
            --step-3: clamp(1.777rem, 1.5rem + 1.385vw, 2.5rem);
            --step-4: clamp(2.369rem, 1.8rem + 2.845vw, 3.333rem);
        }

        body {
            background-color: #0a1628;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(30, 58, 95, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(30, 58, 95, 0.6);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(30, 58, 95, 0.8);
        }

        .gradient-text {
            background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = Motion;

        // Icon components (using lucide via data-lucide attributes)
        const Icon = ({ name, className = "w-5 h-5", ...props }) => {
            const ref = React.useRef();

            useEffect(() => {
                if (ref.current && window.lucide) {
                    lucide.createIcons({
                        attrs: {
                            class: className
                        }
                    });
                }
            }, []);

            return <i data-lucide={name} className={className} ref={ref} {...props}></i>;
        };

        const ProductDemo = () => {
            const [currentStep, setCurrentStep] = useState(0);
            const [isPlaying, setIsPlaying] = useState(true);
            const [typedText, setTypedText] = useState('');
            const [blocks, setBlocks] = useState([]);
            const [showCursor, setShowCursor] = useState(true);

            const demoSequence = [
                {
                    type: 'typing',
                    text: '/text',
                    blockType: 'text',
                    blockData: {
                        content: 'Welcome to Devlog! 🎉 Create beautiful documents with our powerful block system. Type "/" to see all available commands.',
                        tags: ['#demo', '#getting-started']
                    }
                },
                {
                    type: 'typing',
                    text: '/code',
                    blockType: 'code',
                    blockData: {
                        language: 'javascript',
                        filePath: 'src/components/App.jsx',
                        content: `function App() {\n  const [blocks, setBlocks] = useState([]);\n\n  return <Document blocks={blocks} />;\n}`
                    }
                },
                {
                    type: 'typing',
                    text: '/h1',
                    blockType: 'heading',
                    blockData: {
                        level: 1,
                        content: '📚 Project Documentation'
                    }
                },
                {
                    type: 'typing',
                    text: '/ai',
                    blockType: 'ai',
                    blockData: {
                        messages: [
                            { role: 'user', content: 'How do I add a new feature to Devlog?' },
                            { role: 'ai', content: 'Great question! Start by creating a new component in the components folder, then register it in the Block.jsx mapping. Would you like me to show you an example?' }
                        ]
                    }
                },
                {
                    type: 'typing',
                    text: '/table',
                    blockType: 'table',
                    blockData: {
                        headers: ['Feature', 'Status', 'Priority'],
                        rows: [
                            ['Block System', '✅ Complete', 'High'],
                            ['AI Integration', '🚧 In Progress', 'High'],
                            ['Dark Mode', '✅ Complete', 'Medium'],
                            ['Export to PDF', '📋 Planned', 'Low']
                        ]
                    }
                },
                {
                    type: 'typing',
                    text: '/todo',
                    blockType: 'todo',
                    blockData: {
                        todos: [
                            { task: 'Design UI mockups', status: 'done', priority: 'high' },
                            { task: 'Implement block animations', status: 'in-progress', priority: 'high' },
                            { task: 'Write user documentation', status: 'in-progress', priority: 'medium' },
                            { task: 'Add unit tests', status: 'todo', priority: 'low' }
                        ]
                    }
                }
            ];

            // Typing animation
            useEffect(() => {
                if (!isPlaying) return;

                const step = demoSequence[currentStep];
                if (!step) {
                    setTimeout(() => {
                        setCurrentStep(0);
                        setBlocks([]);
                        setTypedText('');
                    }, 3000);
                    return;
                }

                let charIndex = 0;
                const typingInterval = setInterval(() => {
                    if (charIndex < step.text.length) {
                        setTypedText(step.text.slice(0, charIndex + 1));
                        charIndex++;
                    } else {
                        clearInterval(typingInterval);
                        setTimeout(() => {
                            setBlocks(prev => [...prev, {
                                id: Date.now(),
                                type: step.blockType,
                                data: step.blockData
                            }]);
                            setTypedText('');
                            setTimeout(() => {
                                setCurrentStep(prev => prev + 1);
                            }, 1000);
                        }, 500);
                    }
                }, 100);

                return () => clearInterval(typingInterval);
            }, [currentStep, isPlaying]);

            // Cursor blink
            useEffect(() => {
                const cursorInterval = setInterval(() => {
                    setShowCursor(prev => !prev);
                }, 530);
                return () => clearInterval(cursorInterval);
            }, []);

            const handlePlayPause = () => setIsPlaying(!isPlaying);
            const handleRestart = () => {
                setCurrentStep(0);
                setBlocks([]);
                setTypedText('');
                setIsPlaying(true);
            };

            return (
                <div className="min-h-screen bg-dark-primary py-16 px-4">
                    <div className="max-w-5xl mx-auto">
                        {/* Header */}
                        <motion.div
                            className="text-center mb-12"
                            initial={{ opacity: 0, y: -20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 0.6 }}
                        >
                            <h1 className="text-5xl font-bold mb-4 gradient-text">
                                Devlog Product Demo
                            </h1>
                            <p className="text-text-secondary text-lg mb-2">
                                Watch how easy it is to create rich, interactive documents
                            </p>
                            <p className="text-text-secondary/60 text-sm">
                                Type <span className="text-accent-green font-mono">/command</span> to add blocks • Automatic demo is running
                            </p>

                            {/* Controls */}
                            <div className="flex items-center justify-center gap-4 mt-8">
                                <motion.button
                                    whileHover={{ scale: 1.05 }}
                                    whileTap={{ scale: 0.95 }}
                                    onClick={handlePlayPause}
                                    className="px-6 py-3 bg-accent-green text-dark-primary rounded-lg font-medium flex items-center gap-2 hover:bg-accent-green/80 transition-colors shadow-lg"
                                >
                                    <Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" />
                                    {isPlaying ? 'Pause' : 'Play'}
                                </motion.button>
                                <motion.button
                                    whileHover={{ scale: 1.05 }}
                                    whileTap={{ scale: 0.95 }}
                                    onClick={handleRestart}
                                    className="px-6 py-3 bg-dark-secondary text-text-primary rounded-lg font-medium flex items-center gap-2 hover:bg-dark-secondary/80 transition-colors border border-dark-secondary shadow-lg"
                                >
                                    <Icon name="rotate-ccw" className="w-5 h-5" />
                                    Restart
                                </motion.button>
                            </div>
                        </motion.div>

                        {/* Demo Window */}
                        <motion.div
                            className="bg-dark-secondary/50 backdrop-blur-sm rounded-2xl border-2 border-dark-secondary/50 shadow-2xl overflow-hidden"
                            initial={{ opacity: 0, scale: 0.95 }}
                            animate={{ opacity: 1, scale: 1 }}
                            transition={{ duration: 0.6, delay: 0.2 }}
                        >
                            {/* Window Header */}
                            <div className="bg-dark-secondary/80 px-6 py-4 border-b border-dark-secondary flex items-center justify-between">
                                <div className="flex items-center gap-2">
                                    <div className="w-3 h-3 rounded-full bg-red-500"></div>
                                    <div className="w-3 h-3 rounded-full bg-yellow-500"></div>
                                    <div className="w-3 h-3 rounded-full bg-green-500"></div>
                                </div>
                                <div className="text-text-secondary text-sm font-medium">
                                    Untitled Document
                                </div>
                                <div className="w-16"></div>
                            </div>

                            {/* Content */}
                            <div className="p-8 min-h-[600px] max-h-[600px] overflow-y-auto">
                                <AnimatePresence mode="popLayout">
                                    {blocks.map((block, index) => (
                                        <motion.div
                                            key={block.id}
                                            initial={{ opacity: 0, y: 20, scale: 0.95 }}
                                            animate={{ opacity: 1, y: 0, scale: 1 }}
                                            exit={{ opacity: 0, scale: 0.95 }}
                                            transition={{
                                                duration: 0.4,
                                                delay: index * 0.05,
                                                type: "spring",
                                                stiffness: 200,
                                                damping: 20
                                            }}
                                            className="mb-6"
                                        >
                                            <BlockRenderer block={block} />
                                        </motion.div>
                                    ))}

                                    {/* Typing Area */}
                                    {typedText && (
                                        <motion.div
                                            initial={{ opacity: 0 }}
                                            animate={{ opacity: 1 }}
                                            exit={{ opacity: 0 }}
                                            className="relative"
                                        >
                                            <motion.div
                                                className="bg-dark-secondary/50 rounded-lg p-4 border border-accent-green/30"
                                                animate={{
                                                    boxShadow: showCursor
                                                        ? '0 0 0 2px rgba(16, 185, 129, 0.3)'
                                                        : '0 0 0 2px rgba(16, 185, 129, 0.1)'
                                                }}
                                            >
                                                <div className="flex items-center gap-2">
                                                    <span className="text-accent-green text-lg font-mono">{typedText}</span>
                                                    {showCursor && (
                                                        <motion.div
                                                            className="w-0.5 h-5 bg-accent-green"
                                                            animate={{ opacity: [1, 0] }}
                                                            transition={{ duration: 0.5, repeat: Infinity }}
                                                        />
                                                    )}
                                                </div>
                                            </motion.div>

                                            <motion.div
                                                initial={{ opacity: 0, y: -10 }}
                                                animate={{ opacity: 1, y: 0 }}
                                                className="absolute top-full mt-2 left-0 bg-dark-primary/90 backdrop-blur-sm border border-accent-green/30 rounded-lg p-3 shadow-xl"
                                            >
                                                <div className="text-xs text-text-secondary flex items-center gap-2">
                                                    <span className="text-accent-green">↵</span>
                                                    <span>Press Enter to create block</span>
                                                </div>
                                            </motion.div>
                                        </motion.div>
                                    )}

                                    {/* Empty State */}
                                    {blocks.length === 0 && !typedText && (
                                        <motion.div
                                            initial={{ opacity: 0 }}
                                            animate={{ opacity: 1 }}
                                            className="text-center py-20"
                                        >
                                            <motion.div
                                                animate={{
                                                    scale: [1, 1.1, 1],
                                                    opacity: [0.3, 0.5, 0.3]
                                                }}
                                                transition={{ duration: 2, repeat: Infinity }}
                                            >
                                                <Icon name="type" className="w-16 h-16 mx-auto text-text-secondary/30 mb-4" />
                                            </motion.div>
                                            <p className="text-text-secondary/50 text-lg">
                                                Type <span className="text-accent-green font-mono">/</span> to start creating...
                                            </p>
                                        </motion.div>
                                    )}
                                </AnimatePresence>
                            </div>
                        </motion.div>

                        {/* Features Grid */}
                        <motion.div
                            initial={{ opacity: 0, y: 20 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ duration: 0.6, delay: 0.4 }}
                            className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mt-12"
                        >
                            {[
                                { icon: 'type', label: 'Text', color: 'text-blue-400' },
                                { icon: 'code', label: 'Code', color: 'text-green-400' },
                                { icon: 'heading', label: 'Headings', color: 'text-purple-400' },
                                { icon: 'message-square', label: 'AI Chat', color: 'text-yellow-400' },
                                { icon: 'table', label: 'Tables', color: 'text-pink-400' },
                                { icon: 'check-square', label: 'Tasks', color: 'text-cyan-400' },
                            ].map((feature, index) => (
                                <motion.div
                                    key={feature.label}
                                    initial={{ opacity: 0, scale: 0.8 }}
                                    animate={{ opacity: 1, scale: 1 }}
                                    transition={{ duration: 0.4, delay: 0.6 + index * 0.1 }}
                                    whileHover={{ scale: 1.05, y: -5 }}
                                    className="bg-dark-secondary/30 rounded-lg p-4 border border-dark-secondary/50 text-center cursor-pointer"
                                >
                                    <Icon name={feature.icon} className={`w-8 h-8 mx-auto mb-2 ${feature.color}`} />
                                    <p className="text-text-secondary text-sm font-medium">{feature.label}</p>
                                </motion.div>
                            ))}
                        </motion.div>
                    </div>
                </div>
            );
        };

        // Block Renderer
        const BlockRenderer = ({ block }) => {
            switch (block.type) {
                case 'text':
                    return <TextBlockDemo data={block.data} />;
                case 'code':
                    return <CodeBlockDemo data={block.data} />;
                case 'heading':
                    return <HeadingBlockDemo data={block.data} />;
                case 'ai':
                    return <AIBlockDemo data={block.data} />;
                case 'table':
                    return <TableBlockDemo data={block.data} />;
                case 'todo':
                    return <TodoBlockDemo data={block.data} />;
                default:
                    return null;
            }
        };

        // Text Block
        const TextBlockDemo = ({ data }) => (
            <motion.div
                className="rounded-lg border border-dark-secondary/50 bg-dark-secondary/20 hover:bg-dark-secondary/30 transition-all duration-200"
                whileHover={{ scale: 1.01 }}
            >
                <div className="text-text-primary p-4 rounded-lg">
                    <motion.p
                        initial={{ opacity: 0 }}
                        animate={{ opacity: 1 }}
                        transition={{ duration: 0.6 }}
                        className="leading-relaxed"
                    >
                        {data.content}
                    </motion.p>
                    {data.tags && (
                        <div className="flex gap-2 mt-3">
                            {data.tags.map((tag, i) => (
                                <motion.span
                                    key={i}
                                    initial={{ opacity: 0, scale: 0.8 }}
                                    animate={{ opacity: 1, scale: 1 }}
                                    transition={{ delay: 0.3 + i * 0.1 }}
                                    className="text-xs bg-accent-green/20 text-accent-green px-2 py-1 rounded"
                                >
                                    {tag}
                                </motion.span>
                            ))}
                        </div>
                    )}
                </div>
            </motion.div>
        );

        // Code Block
        const CodeBlockDemo = ({ data }) => (
            <motion.div className="group relative pt-2" whileHover={{ scale: 1.01 }}>
                {data.filePath && (
                    <motion.div
                        initial={{ opacity: 0, y: -10 }}
                        animate={{ opacity: 1, y: 0 }}
                        className="absolute -top-3 left-0 text-xs text-accent-green/80 bg-dark-primary px-2 py-1 rounded-t font-mono z-10 border border-accent-green/30 border-b-0"
                    >
                        {data.filePath}
                    </motion.div>
                )}
                <div className="bg-dark-primary rounded-lg overflow-hidden border border-dark-secondary/50">
                    <div className="flex">
                        <motion.div
                            className="select-none text-text-secondary text-sm font-mono p-4 pr-0 text-right border-r border-dark-secondary/50 leading-6"
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                        >
                            {data.content.split('\n').map((_, i) => <div key={i}>{i + 1}</div>)}
                        </motion.div>
                        <pre className="flex-1 p-4 pl-4 overflow-x-auto font-mono text-sm">
                            <motion.code
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                transition={{ delay: 0.2 }}
                                className="text-text-primary"
                            >
                                {data.content}
                            </motion.code>
                        </pre>
                    </div>
                </div>
            </motion.div>
        );

        // Heading Block
        const HeadingBlockDemo = ({ data }) => {
            const sizeClass = { 1: 'text-4xl', 2: 'text-3xl', 3: 'text-2xl' }[data.level];
            const weightClass = { 1: 'font-bold', 2: 'font-semibold', 3: 'font-medium' }[data.level];

            return (
                <motion.div
                    className="text-text-primary hover:bg-dark-secondary/30 rounded px-2 py-1 transition-colors"
                    whileHover={{ x: 5 }}
                >
                    <div className={`${sizeClass} ${weightClass}`}>{data.content}</div>
                </motion.div>
            );
        };

        // AI Block
        const AIBlockDemo = ({ data }) => (
            <div className="space-y-4 bg-dark-secondary/20 rounded-lg p-4">
                <motion.div
                    className="flex items-center gap-2 text-text-secondary"
                    initial={{ opacity: 0, x: -20 }}
                    animate={{ opacity: 1, x: 0 }}
                >
                    <Icon name="sparkles" className="w-5 h-5 text-accent-green" />
                    <span className="text-sm">AI Conversation</span>
                </motion.div>
                <div className="space-y-3">
                    {data.messages.map((msg, i) => (
                        <motion.div
                            key={i}
                            initial={{ opacity: 0, x: msg.role === 'user' ? 20 : -20 }}
                            animate={{ opacity: 1, x: 0 }}
                            transition={{ delay: i * 0.2 }}
                            className={`flex gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}
                        >
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 ${
                                msg.role === 'user'
                                    ? 'bg-blue-500/20 border-2 border-blue-500/30'
                                    : 'bg-gradient-to-br from-accent-green/20 to-accent-green/10 border-2 border-accent-green/30'
                            }`}>
                                <Icon name={msg.role === 'user' ? 'user' : 'sparkles'} className={`w-4 h-4 ${msg.role === 'user' ? 'text-blue-400' : 'text-accent-green'}`} />
                            </div>
                            <div className={`flex-1 max-w-[85%] rounded-lg px-3 py-2 text-sm border-l-4 ${
                                msg.role === 'user'
                                    ? 'bg-dark-secondary/40 border-l-blue-500'
                                    : 'bg-gradient-to-br from-dark-secondary/20 to-dark-secondary/10 border-l-accent-green'
                            }`}>
                                <p className="text-text-primary">{msg.content}</p>
                            </div>
                        </motion.div>
                    ))}
                </div>
            </div>
        );

        // Table Block
        const TableBlockDemo = ({ data }) => (
            <motion.div
                className="bg-dark-primary/50 backdrop-blur-sm rounded-lg overflow-hidden border border-dark-secondary/30"
                initial={{ opacity: 0, scale: 0.95 }}
                animate={{ opacity: 1, scale: 1 }}
                whileHover={{ scale: 1.01 }}
            >
                <table className="w-full border-collapse">
                    <thead>
                        <tr className="bg-gradient-to-r from-dark-secondary/20 to-dark-secondary/10 border-b border-dark-secondary/30">
                            {data.headers.map((h, i) => (
                                <motion.td
                                    key={i}
                                    initial={{ opacity: 0, y: -10 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    transition={{ delay: i * 0.1 }}
                                    className="px-3 py-2 font-medium text-text-primary/90 text-sm"
                                >
                                    {h}
                                </motion.td>
                            ))}
                        </tr>
                    </thead>
                    <tbody>
                        {data.rows.map((row, i) => (
                            <motion.tr
                                key={i}
                                initial={{ opacity: 0, x: -10 }}
                                animate={{ opacity: 1, x: 0 }}
                                transition={{ delay: 0.2 + i * 0.1 }}
                                className="border-b border-dark-secondary/20 hover:bg-dark-secondary/10 transition-colors"
                            >
                                {row.map((cell, j) => (
                                    <td key={j} className="px-3 py-2 text-text-primary/80 text-sm">{cell}</td>
                                ))}
                            </motion.tr>
                        ))}
                    </tbody>
                </table>
            </motion.div>
        );

        // Todo Block
        const TodoBlockDemo = ({ data }) => {
            const statusColors = {
                'done': 'bg-green-400/10 text-green-400',
                'in-progress': 'bg-blue-400/10 text-blue-400',
                'todo': 'bg-gray-400/10 text-gray-400'
            };

            return (
                <div className="bg-dark-secondary/20 rounded-lg p-4">
                    <motion.div
                        initial={{ opacity: 0, y: -10 }}
                        animate={{ opacity: 1, y: 0 }}
                        className="mb-4"
                    >
                        <h3 className="text-lg font-medium text-text-primary">Tasks</h3>
                        <div className="text-text-secondary text-sm mt-1">
                            {data.todos.length} total • {data.todos.filter(t => t.status === 'done').length} done
                        </div>
                    </motion.div>
                    <div className="space-y-2">
                        {data.todos.map((todo, i) => (
                            <motion.div
                                key={i}
                                initial={{ opacity: 0, x: -20 }}
                                animate={{ opacity: 1, x: 0 }}
                                transition={{ delay: i * 0.15 }}
                                className="flex items-center gap-3 p-3 rounded-lg hover:bg-dark-secondary/30 transition-colors"
                            >
                                <div className="flex-1 text-text-primary text-sm">{todo.task}</div>
                                <span className={`px-2 py-1 rounded text-xs font-medium ${statusColors[todo.status]}`}>
                                    {todo.status === 'in-progress' ? 'In Progress' : todo.status.charAt(0).toUpperCase() + todo.status.slice(1)}
                                </span>
                            </motion.div>
                        ))}
                    </div>
                </div>
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProductDemo />);

        // Initialize Lucide icons
        setTimeout(() => {
            if (window.lucide) {
                lucide.createIcons();
            }
        }, 100);
    </script>
</body>
</html>
